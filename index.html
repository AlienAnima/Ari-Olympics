<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arilympics</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8ff;--ink:#14213d;--blue:#0085c7;--yellow:#f4c300;--green:#009f3d;--red:#df0024;--grey:#d5dae2;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#101a2e;--ink:#f3f8ff;--card:#1b2943;--grey:#46546e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-size:18px;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(60px + env(safe-area-inset-bottom,0px))}
h1{font-size:2.2rem;margin:.2em 0;font-weight:700}h2{margin:.2em 0 .6em}
.rings{display:flex;gap:6px;margin:6px 0 14px}.rings i{width:22px;height:22px;border-radius:50%;border:4px solid}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:block;color:#fff;text-decoration:none;padding:22px 16px;border-radius:18px;font-weight:600;font-size:1.25rem;border:0;text-align:left;font-family:inherit;cursor:pointer}
.c0{background:var(--blue)}.c1{background:#b88f00}.c2{background:var(--green)}.c3{background:var(--red)}.c4{background:#2b2b2b}
.box{background:var(--card);border-radius:16px;padding:16px;margin:10px 0;border:3px solid var(--grey)}
.box h3{margin:0 0 6px}
a{color:var(--blue)}.back{display:inline-block;margin-bottom:8px;font-weight:600}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:2px solid var(--grey);background:var(--card);margin:4px 0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;margin:4px 4px 4px 0}
.btn.del{background:var(--red)}.btn.alt{background:var(--green)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input{flex:1;min-width:140px;width:auto}
.tg{width:100%;padding:18px;border-radius:14px;border:0;font-weight:700;font-size:1.2rem;cursor:pointer;background:var(--grey);color:var(--ink);margin-top:6px}
.tg.w{background:var(--green);color:#fff}.tg.l{background:var(--red);color:#fff}
.rank{display:flex;align-items:center;gap:14px}.rank b{font-size:2rem;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:var(--grey);flex:none}
.rank.r1 b{background:#f4c300;color:#000}.rank.r2 b{background:#c0c4cc;color:#000}.rank.r3 b{background:#cd7f32;color:#000}
.rank div{flex:1}.pts{font-size:1.6rem;font-weight:700}.muted{opacity:.7}
.rich{background:#fff;color:#111;line-height:1.5;overflow-wrap:anywhere}.rich table{border-collapse:collapse;max-width:100%}.rich td,.rich th{border:1px solid #bbb;padding:4px 8px}.rich ul,.rich ol{padding-left:1.4em}.rich a{color:#0066cc}.rich img{max-width:100%;height:auto}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style></head><body><main id="app"></main>
<script>
const DB='https://arilympics-default-rtdb.firebaseio.com'; // Paste your Firebase Realtime Database address between the quotes
const K='silvalympics-v1';
const arr=v=>Array.isArray(v)?v.filter(Boolean):Object.values(v||{});
const mig=ms=>{const o={};for(const g in ms||{}){const m=ms[g]||{};if(typeof m.time=='string'||'a' in m||'b' in m){const n={};if(m.a)n[m.a]={opp:m.b||'',time:m.time||''};if(m.b)n[m.b]={opp:m.a||'',time:m.time||''};o[g]=n}else o[g]=m}return o};
const norm=x=>{x=x||{};return{teams:arr(x.teams).map(t=>({...t,members:arr(t.members)})),games:arr(x.games),matches:mig(x.matches),slots:arr(x.slots).map(String),results:x.results||{},pw:x.pw||'olympics'}};
const getLocal=()=>{try{return JSON.parse(localStorage.getItem(K)||'null')}catch(e){return null}};
let D=norm(DB?null:getLocal());
const base=()=>DB.replace(/\/$/,'');
function put(path,val){fetch(base()+'/'+path+'.json',{method:val==null?'DELETE':'PUT',body:val==null?undefined:JSON.stringify(val)}).catch(()=>{})}
const PARTS=['teams','games','matches','slots','pw'];
const save=p=>{if(DB){(p?[p]:PARTS).forEach(k=>put(k,D[k]));return}try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Could not save. Storage may be full. Try smaller pictures.')}};
let last=null;
async function pull(first){
  if(!DB)return;
  try{
    const x=await(await fetch(base()+'/.json')).json(),s=JSON.stringify(x);
    if(first&&x==null){const l=getLocal();if(l){D=norm(l);save();save('results');last=null;view();return}}
    if(s===last)return;last=s;D=norm(x);
    const a=document.activeElement;
    if(first||!(a&&a.closest&&a.closest('#app')&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))){const y=scrollY;view();scrollTo(0,y)}
  }catch(e){if(first)view()}
}
let unlocked=false;
const isOk=()=>{try{return sessionStorage.getItem('ok')=='1'}catch(e){return unlocked}};
const setOk=v=>{unlocked=v;try{v?sessionStorage.setItem('ok','1'):sessionStorage.removeItem('ok')}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=id=>D.teams.find(t=>t.id==id),G=id=>D.games.find(g=>g.id==id);
const TYPES={game:'Game','break-all':'Break for all teams','break-two':'Break for two teams'};
const typ=g=>g.type||'game',isG=g=>typ(g)=='game',GM=()=>D.games.filter(isG);
const itemTime=(g,t)=>typ(g)=='break-all'?(((D.matches[g.id]||{})._all||{}).time||''):(((D.matches[g.id]||{})[t]||{}).time||'');
const si=x=>{const i=D.slots.indexOf(x);return i<0?999:i};
const tsel=(cur,js,list)=>{list=list||D.slots;return`<select style="flex:1;min-width:130px;width:auto" onchange="${js}"><option value="">Choose a time</option>${list.map(s=>`<option${s==cur?' selected':''}>${esc(s)}</option>`).join('')}${cur&&!D.slots.includes(cur)?`<option selected>${esc(cur)}</option>`:''}</select>`};
const slotOK=(g,t,o,s)=>{if(D.games.some(x=>x.id!=g.id&&(itemTime(x,t)==s||(o&&itemTime(x,o)==s))))return false;const m=D.matches[g.id]||{};for(const x in m){if(x=='_all'||x==t||x==o)continue;if(m[x].time==s)return false}return true};
const allOK=(g,s)=>!D.games.some(x=>x.id!=g.id&&typ(x)=='break-all'&&itemTime(x,'')==s)&&D.teams.every(t=>!D.games.some(x=>x.id!=g.id&&itemTime(x,t.id)==s));
const app=document.getElementById('app');
const rings=()=>'<div class="rings"><i style="color:#0085c7"></i><i style="color:#f4c300"></i><i style="color:#2b2b2b"></i><i style="color:#009f3d"></i><i style="color:#df0024"></i></div>';
const back=(h,t='Back')=>`<a class="back" href="#/${h}">&larr; ${t}</a>`;
const tile=(h,t,i)=>`<a class="tile c${i%5}" href="#/${h}">${t}</a>`;
const empty=t=>`<p class="muted">${t}</p>`;
const val=id=>document.getElementById(id).value.trim();
const OKT=new Set(['B','STRONG','I','EM','U','S','BR','P','DIV','SPAN','UL','OL','LI','H1','H2','H3','H4','A','TABLE','THEAD','TBODY','TR','TD','TH','BLOCKQUOTE','SUB','SUP','IMG']);
const BAD=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','FORM','INPUT','BUTTON','TEXTAREA','SELECT','SVG','MATH','TEMPLATE']);
const OKS=['color','background-color','font-weight','font-style','text-decoration','text-align'];
function clean(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  (function walk(n){
    [...n.childNodes].forEach(c=>{
      if(c.nodeType==3)return;
      if(c.nodeType!=1||BAD.has(c.tagName.toUpperCase())){c.remove();return}
      walk(c);
      if(!OKT.has(c.tagName)){c.replaceWith(...c.childNodes);return}
      const keep=[];
      OKS.forEach(p=>{const v=c.style.getPropertyValue(p);if(v&&!/url|expression|javascript/i.test(v))keep.push(p+':'+v)});
      const raw=c.tagName=='A'?(c.getAttribute('href')||''):c.tagName=='IMG'?(c.getAttribute('src')||''):'';
      [...c.attributes].forEach(a=>c.removeAttribute(a.name));
      if(keep.length)c.setAttribute('style',keep.join(';'));
      if(c.tagName=='IMG'){if(/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(raw)||/^https:\/\//i.test(raw))c.setAttribute('src',raw);else c.remove()}else if(c.tagName=='A'&&/^https?:\/\//i.test(raw)){c.setAttribute('href',raw);c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}
    });
  })(doc.body);
  return doc.body.innerHTML
}
const rulesHtml=g=>g.html?clean(g.html):esc(g.rules||'Rules have not been written yet.').replace(/\n/g,'<br>');
const rulesEdit=g=>g.html?clean(g.html):esc(g.rules||'').replace(/\n/g,'<br>');
const fmt=c=>document.execCommand(c);
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(file.type=='image/jpeg'?'image/jpeg':'image/png',0.85))};im.onerror=()=>cb(r.result);im.src=r.result};r.readAsDataURL(file)}
document.addEventListener('paste',e=>{const t=e.target.closest?e.target.closest('#rt'):null;if(!t)return;const f=[...((e.clipboardData&&e.clipboardData.files)||[])].find(x=>/^image\/(png|jpe?g|gif|webp)$/.test(x.type));if(!f||(e.clipboardData.getData('text/plain')||'').trim())return;e.preventDefault();shrink(f,u=>document.execCommand('insertImage',false,u))});

function wins(id){let w=0,l=0;const r=D.results[id]||{};for(const g of GM()){if(r[g.id]=='w')w++;if(r[g.id]=='l')l++}return{w,l}}

function view(){
  const p=(location.hash.replace(/^#\/?/,'')||'home').split('/'),r=p[0],a=p[1];let h='';
  if(r=='admin'&&!isOk()){
    app.innerHTML=back('','Home')+'<h1>Administration</h1><div class="box"><label>Password<input id="pw" type="password" autocomplete="off"></label><button class="btn" onclick="login()">Unlock</button></div>';return}
  if(r=='home'){
    h=rings()+'<h1>Arilympics</h1><div class="grid">'+[['teams','Teams'],['schedule','Schedule'],['rules','Rules - Written'],['videos','Rules - YouTube'],['enter','Enter Results'],['standings','Standings'],['admin','Administration']].map((x,i)=>tile(x[0],x[1],i)).join('')+'</div>'}
  else if(r=='teams'){
    h=back('','Home')+'<h1>Teams</h1><p class="muted">Tap a team name to see its games.</p>'+(D.teams.length?'<div class="grid">'+D.teams.map(t=>`<div class="box"><h3><a href="#/schedule/${t.id}">${esc(t.name)}</a></h3>${t.members.map(m=>`<div>${esc(m)}</div>`).join('')||'<div class="muted">No members yet</div>'}<button class="btn" onclick="rename('${t.id}')">Rename team</button></div>`).join('')+'</div>':empty('No teams yet. Add them in Administration.'))}
  else if(r=='schedule'&&a){
    const t=T(a);h=back('teams','Teams')+(t?`<h1>${esc(t.name)}</h1>`+(D.games.length?D.games.slice().sort((x,y)=>si(itemTime(x,t.id))-si(itemTime(y,t.id))).map(g=>{const k=typ(g),tag=k=='game'?'':'<span class="muted"> (break)</span>',tm=esc(itemTime(g,t.id)||'Time to be set');if(k=='break-all')return`<div class="box"><h3>${esc(g.name)}${tag}</h3><div>${tm}</div><div>Everyone</div></div>`;const e=(D.matches[g.id]||{})[t.id]||{},o=T(e.opp);return`<div class="box"><h3>${esc(g.name)}${tag}</h3><div>${tm}</div><div>${o?'vs '+esc(o.name):'Opponent to be set'}</div>${k=='game'?`<a href="#/rules/${g.id}">Read the rules</a>`:''}</div>`}).join(''):empty('Nothing scheduled yet.')):empty('Team not found.'))}
  else if(r=='schedule'){
    h=back('','Home')+'<h1>Schedule</h1>'+(D.games.length?D.games.map(g=>{const m=D.matches[g.id]||{},k=typ(g),tag=k=='game'?'':'<span class="muted"> (break)</span>';if(k=='break-all')return`<div class="box"><h3>${esc(g.name)}${tag}</h3><div>${esc(itemTime(g,'')||'Time to be set')}: everyone</div></div>`;const seen={},L=x=>`<a href="#/schedule/${x.id}">${esc(x.name)}</a>`;const rows=D.teams.map(t=>{if(seen[t.id])return'';const e=m[t.id]||{},o=T(e.opp);seen[t.id]=1;if(o)seen[o.id]=1;return`<div>${esc(e.time||'Time to be set')}: ${o?L(t)+' vs '+L(o):L(t)+' (opponent to be set)'}</div>`}).join('');return`<div class="box"><h3>${esc(g.name)}${tag}</h3>${rows||'<span class="muted">No teams yet</span>'}</div>`}).join(''):empty('Nothing scheduled yet. Add items in Administration.'))}
  else if(r=='rules'&&!a){
    h=back('','Home')+'<h1>Rules - Written</h1>'+(GM().length?'<div class="grid">'+GM().map((g,i)=>tile('rules/'+g.id,esc(g.name),i)).join('')+'</div>':empty('No games yet.'))}
  else if(r=='rules'){
    const g=G(a);h=back('rules','All rules')+(g?`<h1>${esc(g.name)}</h1><div class="box rich">${rulesHtml(g)}</div>`:empty('Game not found.'))}
  else if(r=='videos'){
    h=back('','Home')+'<h1>Rules - YouTube</h1>'+(GM().length?GM().map(g=>`<div class="box"><h3>${esc(g.name)}</h3>${/^https?:\/\//i.test(g.video||'')?`<a class="btn" style="display:inline-block;text-decoration:none" href="${esc(g.video)}" target="_blank" rel="noopener">Watch video</a>`:'<span class="muted">No video yet</span>'}</div>`).join(''):empty('No games yet.'))}
  else if(r=='enter'&&!a){
    h=back('','Home')+'<h1>Enter Results</h1><p>Pick your team.</p>'+(D.teams.length?'<div class="grid">'+D.teams.map((t,i)=>tile('enter/'+t.id,esc(t.name),i)).join('')+'</div>':empty('No teams yet.'))}
  else if(r=='enter'){
    const t=T(a);h=back('enter','Teams')+(t?`<h1>${esc(t.name)}</h1><p>Tap a box: once for win, twice for lose, three times to clear.</p>`+(GM().length?GM().map(g=>{const s=(D.results[t.id]||{})[g.id];return`<div class="box"><h3>${esc(g.name)}</h3><button class="tg ${s||''}" onclick="tog('${t.id}','${g.id}')">${s=='w'?'WIN':s=='l'?'LOSE':'Tap to score'}</button></div>`}).join(''):empty('No games yet.')):empty('Team not found.'))}
  else if(r=='standings'){
    const rows=D.teams.map(t=>({t,...wins(t.id)})).sort((x,y)=>y.w-x.w||x.l-y.l);
    h=back('','Home')+'<h1>Standings</h1>'+(rows.length?rows.map((x,i)=>`<div class="box rank r${i+1}"><b>${i+1}</b><div><h3>${esc(x.t.name)}</h3><span class="muted">${x.w} wins, ${x.l} losses</span></div><span class="pts">${x.w}</span></div>`).join(''):empty('No teams yet.'))}
  else if(r=='admin'&&!a){
    h=back('','Home')+'<h1>Administration</h1><div class="grid">'+[['admin/teams','Teams'],['admin/schedule','Schedule'],['admin/rules','Rules - Written'],['admin/videos','Rules - YouTube']].map((x,i)=>tile(x[0],x[1],i)).join('')+'</div><div class="box"><button class="btn alt" onclick="chpw()">Change password</button><button class="btn" onclick="logout()">Lock</button><button class="btn del" onclick="resetScores()">Clear all scores</button></div>'}
  else if(r=='admin'&&a=='teams'){
    h=back('admin','Admin')+'<h1>Manage teams</h1><div class="box row"><input id="nt" placeholder="New team name"><button class="btn" onclick="addTeam()">Add team</button></div>'+D.teams.map(t=>`<div class="box"><h3>${esc(t.name)}</h3>${t.members.map((m,i)=>`<div class="row"><span style="flex:1">${esc(m)}</span><button class="btn del" onclick="delMember('${t.id}',${i})">Remove</button></div>`).join('')}${t.members.length<2?`<div class="row"><input id="m${t.id}" placeholder="Member name"><button class="btn" onclick="addMember('${t.id}')">Add member</button></div>`:'<div class="muted">Team is full (2 members)</div>'}<button class="btn del" onclick="delTeam('${t.id}')">Delete team</button></div>`).join('')}
  else if(r=='admin'&&a=='schedule'){
    h=back('admin','Admin')+'<h1>Schedule setup</h1><div class="box"><h3>Time slots</h3><div class="row"><input id="ns" placeholder="e.g. 10:00 AM"><button class="btn" onclick="addSlot()">Add time slot</button></div>'+(D.slots.length?D.slots.map((x,i)=>`<div class="row"><span style="flex:1">${esc(x)}</span><button class="btn del" onclick="delSlot(${i})">Remove</button></div>`).join(''):'<p class="muted">Add time slots in the order they happen. They become the choices when you schedule.</p>')+'</div><div class="box"><h3>Add to schedule</h3><input id="ng" placeholder="Name, e.g. Tug of war or Lunch"><select id="gt"><option value="game">Game</option><option value="break-all">Break for all teams</option><option value="break-two">Break for two teams</option></select><button class="btn" onclick="addGame()">Add</button></div>'+D.games.map(g=>`<div class="box row"><span style="flex:1">${esc(g.name)}<br><span class="muted">${TYPES[typ(g)]}</span></span><button class="btn del" onclick="delGame('${g.id}')">Delete</button></div>`).join('')+'<p><a class="btn" style="display:inline-block;text-decoration:none" href="#/admin/scheduling">Go to scheduling</a></p>'}
  else if(r=='admin'&&a=='scheduling'){
    const pairs=D.games.filter(g=>typ(g)!='break-all'),alls=D.games.filter(g=>typ(g)=='break-all');
    const rowFor=(t,g)=>{const m=D.matches[g.id]||{},e=m[t.id]||{},o=T(e.opp),nm=`<b style="min-width:120px">${esc(g.name)}</b>`;
      if(o&&e.time)return`<div class="row" style="margin:8px 0">${nm}<span style="flex:1">${esc(e.time)} vs ${esc(o.name)}</span><button class="btn del" onclick="clearItem('${g.id}','${t.id}')">Clear</button></div>`;
      const slots=D.slots.filter(x=>x==e.time||slotOK(g,t.id,e.opp||'',x));
      const opts='<option value="">No opponent yet</option>'+D.teams.filter(x=>x.id!=t.id).map(x=>{const xe=m[x.id]||{},taken=xe.opp&&xe.opp!=t.id,sl=e.time||xe.time||'',bad=!taken&&sl&&!slotOK(g,t.id,x.id,sl),why=taken?' (already playing '+esc((T(xe.opp)||{}).name||'')+')':bad?' (not free then)':'';return`<option value="${x.id}"${x.id==e.opp?' selected':''}${taken||bad?' disabled':''}>${esc(x.name)}${why}</option>`}).join('');
      return`<div class="row" style="margin:8px 0">${nm}${tsel(e.time||'',`setTime('${g.id}','${t.id}',this.value)`,slots)}<select style="flex:1;min-width:150px;width:auto" onchange="setOpp('${g.id}','${t.id}',this.value)">${opts}</select></div>`};
    h=back('admin/schedule','Setup')+'<h1>Scheduling</h1><p class="muted">Each time list only shows times that are free for the team and the item. Once an item is set, use Clear to change it.</p>'+(alls.length?`<div class="box"><h3>Breaks for everyone</h3>${alls.map(g=>{const c=itemTime(g,'');return`<div class="row" style="margin:8px 0"><b style="min-width:120px">${esc(g.name)}</b>${tsel(c,`setAll('${g.id}',this.value)`,D.slots.filter(x=>x==c||allOK(g,x)))}</div>`}).join('')}</div>`:'')+(pairs.length&&D.teams.length?D.teams.map(t=>`<div class="box"><h3>${esc(t.name)}</h3>${pairs.map(g=>rowFor(t,g)).join('')}</div>`).join(''):(alls.length?'':empty('Add teams and schedule items first.')))}
  else if(r=='admin'&&a=='rules'&&!p[2]){
    h=back('admin','Admin')+'<h1>Write rules</h1>'+(GM().length?'<div class="grid">'+GM().map((g,i)=>tile('admin/rules/'+g.id,esc(g.name),i)).join('')+'</div>':empty('Add games first.'))}
  else if(r=='admin'&&a=='rules'){
    const g=G(p[2]);h=back('admin/rules','All games')+(g?`<h1>${esc(g.name)}</h1><p class="muted">Paste rules from another page or document and the formatting stays.</p><div><button class="btn" onmousedown="event.preventDefault()" onclick="fmt('bold')"><b>B</b></button><button class="btn" onmousedown="event.preventDefault()" onclick="fmt('italic')"><i>I</i></button><button class="btn" onmousedown="event.preventDefault()" onclick="fmt('underline')"><u>U</u></button><button class="btn" onmousedown="event.preventDefault()" onclick="fmt('insertUnorderedList')">Bullets</button><button class="btn alt" onmousedown="event.preventDefault()" onclick="document.getElementById('pf').click()">Add picture</button><input id="pf" type="file" accept="image/*" hidden onchange="addPic(this)"></div><div id="rt" class="rich" contenteditable="true" style="min-height:240px;border:2px solid var(--grey);border-radius:10px;padding:10px;margin:6px 0">${rulesEdit(g)}</div><button class="btn" onclick="saveRules('${g.id}')">Save rules</button><span id="ok" class="muted"></span>`:empty('Game not found.'))}
  else if(r=='admin'&&a=='videos'){
    h=back('admin','Admin')+'<h1>YouTube links</h1>'+(GM().length?GM().map(g=>`<div class="box"><h3>${esc(g.name)}</h3><input value="${esc(g.video||'')}" placeholder="https://youtube.com/..." onchange="setV('${g.id}',this.value)"></div>`).join(''):empty('Add games first.'))}
  else h=back('','Home')+empty('Page not found.');
  app.innerHTML=h;window.scrollTo(0,0)
}
function login(){if(val('pw')==D.pw){setOk(true);view()}else alert('Wrong password')}
function logout(){setOk(false);location.hash='#/'}
function chpw(){const n=prompt('New password');if(n){D.pw=n;save();alert('Password changed')}}
function resetScores(){if(confirm('Clear every win and loss?')){D.results={};save('results');alert('Scores cleared')}}
function rename(id){const t=T(id),n=prompt('Team name',t.name);if(n&&n.trim()){t.name=n.trim();save();view()}}
function addTeam(){const n=val('nt');if(!n)return;D.teams.push({id:uid(),name:n,members:[]});save();view()}
function delTeam(id){if(!confirm('Delete this team and its scores?'))return;D.teams=D.teams.filter(t=>t.id!=id);delete D.results[id];for(const k in D.matches){const m=D.matches[k];delete m[id];for(const x in m)if(m[x].opp==id)m[x].opp=''}save();save('results');view()}
function addMember(id){const n=val('m'+id),t=T(id);if(!n||t.members.length>=2)return;t.members.push(n);save();view()}
function delMember(id,i){T(id).members.splice(i,1);save();view()}
function addGame(){const n=val('ng');if(!n)return;D.games.push({id:uid(),name:n,type:document.getElementById('gt').value,rules:'',video:''});save();view()}
function addSlot(){const n=val('ns');if(!n||D.slots.includes(n))return;D.slots.push(n);save('slots');view()}
function delSlot(i){D.slots.splice(i,1);save('slots');view()}
function clearItem(g,t){const m=D.matches[g]||{},e=m[t];if(!e)return;if(e.opp&&m[e.opp]){m[e.opp].opp='';m[e.opp].time=''}e.opp='';e.time='';save('matches');rv()}
function setAll(g,v){(D.matches[g]=D.matches[g]||{})._all={time:v};save('matches');rv()}
function delGame(id){if(!confirm('Delete this item?'))return;D.games=D.games.filter(g=>g.id!=id);delete D.matches[id];save();view()}
const rv=()=>{const y=scrollY;view();scrollTo(0,y)};
const E=(g,t)=>{const m=D.matches[g]=D.matches[g]||{};return m[t]=m[t]||{opp:'',time:''}};
function unpair(g,t){const m=D.matches[g]||{},e=m[t];if(!e)return;if(e.opp&&m[e.opp]&&m[e.opp].opp==t)m[e.opp].opp='';e.opp=''}
function setOpp(g,t,o){unpair(g,t);if(o){unpair(g,o);const a=E(g,t),b=E(g,o),tm=a.time||b.time||'';a.opp=o;b.opp=t;a.time=tm;b.time=tm}save('matches');rv()}
function setTime(g,t,v){const e=E(g,t);e.time=v.trim();if(e.opp)E(g,e.opp).time=e.time;save('matches');rv()}
async function saveRules(id){
  const e=document.getElementById('rt'),g=G(id),ok=document.getElementById('ok');ok.textContent=' Saving...';
  for(const im of [...e.querySelectorAll('img')]){try{const b=await(await fetch(im.src)).blob();im.src=await new Promise(r=>shrink(b,r))}catch(x){}}
  const n=e.querySelectorAll('img').length,html=clean(e.innerHTML),k=(html.match(/<img /g)||[]).length;
  g.rules=e.innerText.trim();g.html=(g.rules||k)?html:'';save();
  ok.textContent=k<n?' Saved, but a picture could not be kept. Use the Add picture button.':' Saved'}
